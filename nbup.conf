# /etc/nbup.conf - settings for nbup
# Must be owned by root and not group/world-writable (installed as 0600).
#
# Replace every <placeholder> below with a path from your own setup. Keep the
# quotes: this file is read by Bash, and an unquoted < or > is a redirection.
# nbup refuses to run while a placeholder is left in place.

# Directory that contains NetBird's docker-compose.yml (the directory where
# you ran the NetBird getting-started script), e.g. "/opt/netbird"
NETBIRD_DIR="<netbird-compose-dir>"

# Dedicated directory for backup archives, e.g. "/var/backups/netbird".
# It is created if missing and forced to root:root 0700, so do not point it
# at a shared directory such as /home or /var/backups itself.
BACKUP_ROOT="<backup-dir>"

KEEP_BACKUPS=10
KEEP_ROLLBACK_IMAGES=3
LOG_FILE=/var/log/nbup.log
HEALTH_TIMEOUT=180
HEALTH_STABLE=20
MIN_FREE_MB=1024

# Optional: lets the script compare Management and reverse-proxy versions
# after an upgrade (the docs require them to match).
#NB_DOMAIN="<netbird-domain>"
#NB_API_TOKEN="<personal-access-token>"
